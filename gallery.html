    <title>Gallery</title>
    <style>
      /* RESPONSIVE GALLERY IMAGES */

.Galleryimage-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    width:100%;
    padding:20px;
}

.Galleryimage-container figure{
    width:300px;
    text-align:center;
}

.Galleryimage-container img{
    width:100%;
    height:auto;
    border-radius:10px;
    object-fit:cover;
}

/* MOBILE VIEW */

@media screen and (max-width:768px){

    .Galleryimage-container{
        flex-direction:column;
        align-items:center;
    }

    .Galleryimage-container figure{
        width:90%;
    }

    .Galleryimage-container img{
        width:100%;
        height:auto;
    }

    h1{
        font-size:28px;
    }

    h2{
        font-size:22px;
    }
}
    @media only screen and (max-width: 600px) {
    }
    /* RESPONSIVE CODE FOR ALL DEVICES */

*{
    box-sizing:border-box;
}

html,body{
    overflow-x:hidden;
    width:100%;
}

img{
    max-width:100%;
    height:auto;
}

.container,
.card-container,
.service-boxes,
nav,
.Servicesnav,
header,
.Serviceheader{
    width:100%;
}

@media(max-width:768px){

    body{
        padding:0;
        margin:0;
    }

    .container{
        width:95%;
        margin:auto;
    }

    nav,
    .Servicesnav,
    header,
    .Serviceheader{
        flex-direction:column;
        text-align:center;
    }

    .card-container,
    .service-boxes{
        grid-template-columns:1fr;
    }

    table{
        width:100%;
        font-size:14px;
    }

    h1{
        font-size:30px;
    }

    h2{
        font-size:22px;
    }

    p{
        font-size:15px;
    }
}
  </style>
</head>
